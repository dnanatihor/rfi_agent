[tool.poetry]
name = "rfi-agent"
version = "0.5.0"
description = "Local RFI agent: project document index, cited drafts, and approved answer memory"
authors = ["Rohit Anand <dnanatihor@gmail.com>"]
readme = "docs/DEPLOY.md"
packages = [{ include = "rfi_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.32" }
sqlalchemy = ">=2.0.36"
psycopg = { extras = ["binary"], version = ">=3.2" }
pgvector = ">=0.3.6"
pydantic-settings = ">=2.6"
python-dotenv = ">=1.0"
httpx = ">=0.27"
langgraph = ">=0.2.60,<1"
langchain-openai = ">=0.3"
langchain-anthropic = ">=0.3"
langchain-aws = ">=0.2"
pypdf = ">=5.1"
python-docx = ">=1.1"
openpyxl = ">=3.1"
python-pptx = ">=1.0"
python-multipart = ">=0.0.12"
google-api-python-client = ">=2.150"
google-auth-oauthlib = ">=1.2"
google-auth = ">=2.36"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
