services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rfi
      POSTGRES_PASSWORD: rfi
      POSTGRES_DB: rfi
    ports:
      - "5433:5432"
    volumes:
      - rfi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfi -d rfi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rfi_pgdata:
